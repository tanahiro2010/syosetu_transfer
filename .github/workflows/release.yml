name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続で push されたときは順番に処理する（途中で止めると下書きのリリースが残るため）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # push ごとにリリースを作るので、タグは「バージョン-build.実行番号」にする
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          # 作成直後の下書きは一覧に出ないことがあるので、作成 API の返り値から ID を受け取る
          id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="syosetu_transfer ${tag}" \
            -f body="main の ${GITHUB_SHA::7} から自動ビルドしました。" \
            -F draft=true \
            --jq .id)
          if [ -z "$id" ]; then
            echo "リリースIDを取得できませんでした" >&2
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false \
            -f make_latest=true
